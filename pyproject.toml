[project]
name = "alignment-artifacts"
version = "0.1.0"
description = "Apart Research Sprint"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dnslib>=0.9.26",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.4",
    "vite>=1.5.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
