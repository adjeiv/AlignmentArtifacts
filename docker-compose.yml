# Docker is only for the canary-serving infra (static-site's nginx,
# dns-resolver, log-monitor) - the backend and frontend always run on the
# host (`make backend` / `make frontend`, or `make up` for both). The
# backend authenticates to Claude via the `claude` CLI however it's already
# logged in on this machine (see CLAUDE.md); that doesn't carry into a
# container, so there's deliberately no backend/frontend service here.
#
# Bind-mounts point at the exact local paths backend/agents.py writes to by
# default (STATIC_SITE_CONTENT_DIR, DNS_ZONES_FILE, ENDPOINTS_FILE, PKI_DIR)
# so a host-run backend and these containers share state without any named
# volume or extra wiring - see README.md "Custom domains for canaries".
services:
  static-site:
    build: ./static-site
    volumes:
      - ./static-site/content:/srv
      - ./pki/out:/etc/nginx/certs:ro
      - ./static-site/logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"

  log-monitor:
    build: ./log-monitor
    environment:
      ACCESS_LOG: /logs/canary_access.log
      ENDPOINTS_FILE: /data/endpoints.json
      # host-run backend, reached via Docker's host-gateway alias (below) -
      # not a "backend" service, since one doesn't exist in this file.
      BACKEND_ORIGIN: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./static-site/logs:/logs:ro
      - ./log-monitor/endpoints.json:/data/endpoints.json:ro
    depends_on:
      - static-site

  dns-resolver:
    build: ./dns-resolver
    environment:
      DNS_ZONES_FILE: /data/zones.json
      # Comma-separated, tried in order - override (`DNS_UPSTREAM=... docker
      # compose up`, or a .env file) with this machine's own DNS server(s)
      # first (see `resolvectl status`) so anything outside zones.json keeps
      # resolving normally once this becomes the system resolver, with a
      # public resolver here only as the last-resort fallback. See
      # dns-resolver/resolver.py.
      DNS_UPSTREAM: ${DNS_UPSTREAM:-8.8.8.8}
    volumes:
      - ./dns-resolver/zones.json:/data/zones.json
    ports:
      - "127.0.0.1:53:53/udp"
