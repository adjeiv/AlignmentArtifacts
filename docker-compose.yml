services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # rfc/agents.py's generate_all() calls the real Anthropic API for
      # real (no offline/mock mode on the backend) - set this in a .env
      # file next to this compose file, or in your shell environment.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY (.env or environment) - the backend's canary pipeline calls the real Anthropic API}
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/companies')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time (Vite inlines these): talk to the real backend instead
        # of frontend/src/api/mockData.ts.
        VITE_USE_MOCK: "false"
        VITE_API_BASE_URL: /api
    ports:
      - "8080:80"
    environment:
      # Runtime: nginx.conf.template proxies /api/* here (see
      # frontend/nginx.conf.template).
      BACKEND_ORIGIN: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
