services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      STATIC_SITE_CONTENT_DIR: /canary-content
      STATIC_SITE_IP: 127.0.0.1
      DNS_ZONES_FILE: /dns-zones/zones.json
    volumes:
      - canary-content:/canary-content
      - dns-zones:/dns-zones
    ports:
      - "8000:8000"

  static-site:
    build: ./static-site
    volumes:
      - canary-content:/srv
      - ./pki/out:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"

  dns-resolver:
    build: ./dns-resolver
    environment:
      DNS_ZONES_FILE: /data/zones.json
    volumes:
      - dns-zones:/data
    ports:
      - "127.0.0.1:53:53/udp"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK: "false"
    environment:
      BACKEND_ORIGIN: http://backend:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  canary-content:
  dns-zones:
