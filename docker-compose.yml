services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      STATIC_SITE_CONTENT_DIR: /canary-content
      STATIC_SITE_IP: 127.0.0.1
      DNS_ZONES_FILE: /dns-zones/zones.json
      ENDPOINTS_FILE: /canary-endpoints/endpoints.json
      # Opt-in - unset means .env planting silently no-ops (see README.md
      # "Real credential canaries"). Must be an email you actually control.
      THINKST_ALERT_EMAIL: ${THINKST_ALERT_EMAIL:-}
      # Opt-in - unset means the GitHub repository canary type falls back to
      # a no-op (see README.md "GitHub repository canaries"). Use a
      # dedicated bot account's PAT, not your own - this creates a real
      # public repo.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO_FULL_NAME: ${GITHUB_REPO_FULL_NAME:-}
    volumes:
      - canary-content:/canary-content
      - dns-zones:/dns-zones
      - canary-endpoints:/canary-endpoints
    ports:
      - "8000:8000"

  static-site:
    build: ./static-site
    volumes:
      - canary-content:/srv
      - ./pki/out:/etc/nginx/certs:ro
      - access-logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"

  log-monitor:
    build: ./log-monitor
    environment:
      ACCESS_LOG: /logs/canary_access.log
      ENDPOINTS_FILE: /data/endpoints.json
      BACKEND_ORIGIN: http://backend:8000
    volumes:
      - access-logs:/logs:ro
      - canary-endpoints:/data:ro
    depends_on:
      - backend
      - static-site

  dns-resolver:
    build: ./dns-resolver
    environment:
      DNS_ZONES_FILE: /data/zones.json
    volumes:
      - dns-zones:/data
    ports:
      - "127.0.0.1:53:53/udp"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK: "false"
    environment:
      BACKEND_ORIGIN: http://backend:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  canary-content:
  dns-zones:
  canary-endpoints:
  access-logs:
