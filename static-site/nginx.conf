# One line per request, including the Host header - log-monitor/monitor.py
# (a separate service, see docker-compose.yml) tails this file and matches
# $host + $request_uri against the per-domain endpoint regexes
# backend/agents.py registers on deploy, to detect a canary trigger.
log_format canary '$time_iso8601 $host $request_uri';
access_log /var/log/nginx/canary_access.log canary;

# Host-based routing with no per-domain config: content lives at
# /srv/<domain>/index.html (written by deploy_static_site in
# backend/agents.py), so a deploy needs zero nginx reload - it just has to
# create that directory and register the domain with the DNS resolver.
#
# The map's regex is also the security boundary: only bare alnum/hyphen
# labels under canary.test can select a root, so a manipulated Host header
# can't path-traverse out of /srv.
map $host $site_root {
    default                                       /srv/_unknown;
    "~^(?<h>[a-z0-9-]+\.canary\.test)$"           /srv/$h;
}

server {
    listen 80 default_server;
    server_name _;
    root $site_root;
    index index.html;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/wildcard.pem;
    ssl_certificate_key /etc/nginx/certs/wildcard.key;
    root $site_root;
    index index.html;
}
