# One line per request, including the Host header - log-monitor/monitor.py
# (a separate service, see docker-compose.yml) tails this file and matches
# $host + $request_uri against the per-domain endpoint regexes
# backend/agents.py registers on deploy, to detect a canary trigger.
log_format canary '$time_iso8601 $host $request_uri';
access_log /var/log/nginx/canary_access.log canary;

# Host-based routing with no per-domain config: content lives at
# /srv/<domain>/index.html (written by deploy_static_site in
# backend/agents.py), so a deploy needs zero nginx reload - it just has to
# create that directory and register the domain with the DNS resolver.
#
# Arbitrary domains, not just *.canary.test - backend/agents.py's
# SiteArtifact.domain lets the model invent a domain per canary (falling
# back to a deterministic <slug>-<id>.canary.test one if that's
# missing/invalid/colliding, see _sanitize_domain), so this has to accept
# any syntactically valid hostname, not one fixed TLD.
#
# The regex is also the security boundary: only a valid DNS hostname (no
# slashes, no "..", labels 1-63 chars of alnum/hyphen) can select a root, so
# a manipulated Host header can't path-traverse out of /srv.
map $host $site_root {
    default                                                                          /srv/_unknown;
    "~^(?<h>[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+)$"   /srv/$h;
}

# Same domain -> directory mapping, but keyed off $ssl_server_name (the TLS
# SNI hostname, available before decryption) rather than $host (the HTTP
# Host header, only readable after) - which cert to present has to be
# decided at the TLS handshake, before nginx can see the request line.
#
# nginx's map can't check whether a file actually exists on disk, so this
# can't just fall back to the wildcard cert whenever a per-domain cert.pem
# is merely missing (e.g. no local CA existed yet at deploy time -
# _issue_leaf_cert is best-effort, see make ca-generate) - a match here
# always wins, whether or not that file is actually there. Instead,
# *.canary.test - the one TLD the static wildcard cert's own SAN list
# covers, so a per-domain cert there is redundant in the first place -
# is special-cased ahead of the generic arbitrary-domain regex, both
# guaranteed to exist and cheaper (no per-domain cert needed at all for the
# fallback domain _sanitize_domain/deploy_noop use). Only a domain outside
# that TLD - one the wildcard cert's SAN could never have covered anyway -
# depends on its own /srv/$h/cert.pem actually being there.
map $ssl_server_name $ssl_cert_path {
    default                                                                          /etc/nginx/certs/wildcard.pem;
    "~^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.canary\.test$"                            /etc/nginx/certs/wildcard.pem;
    "~^(?<h>[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+)$"   /srv/$h/cert.pem;
}

map $ssl_server_name $ssl_key_path {
    default                                                                          /etc/nginx/certs/wildcard.key;
    "~^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.canary\.test$"                            /etc/nginx/certs/wildcard.key;
    "~^(?<h>[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+)$"   /srv/$h/key.pem;
}

server {
    listen 80 default_server;
    server_name _;
    root $site_root;
    index index.html;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     $ssl_cert_path;
    ssl_certificate_key $ssl_key_path;
    root $site_root;
    index index.html;
}
